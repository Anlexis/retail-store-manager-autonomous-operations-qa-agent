[project]
name = "ret-c2-253"
version = "0.1.1"
description = "StoreManagerOpsQAAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repository generation — a stub package on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The framework wheel ships no `py.typed`, so every `framework.*` / `shared.*`
# import resolves to Any. Under a bare `strict = true` that turns each required
# subclass into an error about subclassing Any, and each import into a missing-
# stub error — neither of which says anything about this template's own code.
disallow_subclassing_any = false
# The sample graphs under src/examples/ are read-only reference material for
# template authors. They are excluded rather than edited.
exclude = ["src/examples/"]

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `AgentState` resolves to Any from the untyped wheel, so `class State(AgentState)`
# reports `valid-type` on EVERY field. One cause, one override — chasing the
# individual field errors would mean annotating around a single missing marker.
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
